[project]
authors = [{name = "longred", email = "longredzhong@outlook.com"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = ["requests>=2.34.2,<3", "click>=8.4.2,<9", "build>=1.5.0,<2", "twine>=7.0.0,<8"]
description = "Single-file model routing gateway for jina-on-prem: route by model id, generate docker-compose from a tiny TOML."
keywords = ["jina", "embedding", "reranker", "gateway", "router", "docker-compose", "openai", "llm"]
license = "MIT"
name = "simple-router-for-jina"
readme = "README.md"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
simple-router = "simple_router_for_jina.cli:cli"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
simple_router_for_jina = { path = ".", editable = true }

[tool.pixi.tasks]
build = "python -m build"
check = "twine check dist/*"
publish = { cmd = "twine upload dist/*", depends-on = ["build", "check"] }

# the single-file router is the actual CLI module once packaged
[tool.hatch.build.targets.wheel.force-include]
"simple-router.py" = "simple_router_for_jina/cli.py"

[tool.hatch.build.targets.sdist]
include = [
  "simple-router.py",
  "src",
  "examples",
  "Dockerfile",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

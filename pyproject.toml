[project]
name = "simple-router-for-jina"
version = "0.2.0.dev0"
description = "Compile a versioned Jina serving definition into production deployment artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "longred", email = "longredzhong@outlook.com" }]
keywords = ["jina", "embedding", "reranker", "docker-compose", "helm", "kustomize"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "click>=8.2,<9",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/longred/simple-router-for-jina"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
jina-serving = "simple_router_for_jina.cli:cli"
simple-router = "simple_router_for_jina.cli:cli"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_router_for_jina"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

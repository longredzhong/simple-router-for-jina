apiVersion: serving.jina.ai/v1alpha1
kind: JinaServing
metadata:
  name: licensed-embedding
  namespace: ai-serving
spec:
  mode: embedding
  embedding:
    model: jina-embeddings-v5-text-small
    runtime: cpu
    replicas: 1
    secretEnv:
      - name: JINA_LICENSE_KEY
        composeEnvironment: JINA_LICENSE_KEY
        kubernetesSecret:
          name: jina-license
          key: license-key
  exposure:
    mode: direct
    port: 8080
  production:
    requireImageDigest: false
    networkPolicy: true
    readOnlyRootFilesystem: true
